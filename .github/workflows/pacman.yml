name: Generate Pac-Man Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Pac-Man contribution SVGs
        run: |
          npx -y pacman-contribution-graph --platform github --username Arjjun-S --gameTheme github -o pacman-contribution-graph.svg
          npx -y pacman-contribution-graph --platform github --username Arjjun-S --gameTheme github-dark -o pacman-contribution-graph-dark.svg

      - name: Customize colors and background transparency
        run: |
          python3 -c "
          import re
          
          files = ['pacman-contribution-graph.svg', 'pacman-contribution-graph-dark.svg']
          active_colors = [
              '#9be9a8', '#40c463', '#30a14e', '#216e39', # Light theme active green levels
              '#0e4429', '#006d32', '#26a641', '#39d353'  # Dark theme active green levels
          ]
          
          for filename in files:
              with open(filename, 'r') as f:
                  content = f.read()
              
              # Replace active contribution level colors with #f8b07b
              for color in active_colors:
                  content = content.replace(color, '#f8b07b')
                  content = content.replace(color.upper(), '#f8b07b')
              
              # Make background transparent by changing rect background fill to none
              content = re.sub(r'<rect width=\"100%\" height=\"100%\" fill=\"#[0-9a-fA-F]+\"\s*/>', '<rect width=\"100%\" height=\"100%\" fill=\"none\"/>', content)
              
              with open(filename, 'w') as f:
                  f.write(content)
          "

      - name: Organize output files
        run: |
          mkdir -p output
          mv pacman-contribution-graph.svg output/
          mv pacman-contribution-graph-dark.svg output/

      - name: Deploy SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
